services:
  db:
    image: pgvector/pgvector:pg16
    container_name: notetrace-db
    environment:
      POSTGRES_DB: notetrace
      POSTGRES_USER: notetrace
      POSTGRES_PASSWORD: notetrace_dev
    ports:
      - "5433:5432"   # 主机 5433（避开本机 MySQL 3306）
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notetrace -d notetrace"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
