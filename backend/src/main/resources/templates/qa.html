<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>问答 · NoteTrace 知溯</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">NoteTrace<span class="brand-sub">知溯 · AI 知识库</span></div>
        <nav class="nav">
            <a href="/" th:classappend="${currentPage == 'qa'} ? 'active'">问答</a>
            <a href="/documents" th:classappend="${currentPage == 'documents'} ? 'active'">入库状态</a>
            <a href="/graph" th:classappend="${currentPage == 'graph'} ? 'active'">知识图谱</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="page-title">向你的知识库提问</h1>
    <p class="page-desc">回答基于已导入的笔记，每个结论都带可核对的来源。</p>

    <form method="post" action="/qa">
        <div style="display:flex; gap:10px; align-items:stretch;">
            <input type="text" class="input" name="question" th:value="${question}"
                   placeholder="提问，如：线程池的拒绝策略有哪些？" style="flex:1;">
            <button type="submit" class="btn">提问</button>
        </div>
        <div style="margin-top:12px;">
            <span class="seg">
                <label><input type="radio" name="ai" value="api" th:checked="${aiChoice == null or aiChoice == 'api'}"><span>调用 API（DeepSeek）</span></label>
                <label><input type="radio" name="ai" value="local" th:checked="${aiChoice == 'local'}"><span>本地 AI（Ollama qwen）</span></label>
            </span>
        </div>
    </form>

    <div class="panel" style="margin-top:24px;" th:if="${answerHtml}">
        <div class="answer" th:utext="${answerHtml}"></div>
    </div>

    <div class="panel" th:if="${result != null and !result.references.isEmpty()}">
        <h2 class="section-title">引用来源（点击核对原文）</h2>
        <div class="ref-list">
            <details class="ref-item" th:each="r : ${result.references}" th:id="'ref-' + ${r.index}">
                <summary th:text="'[' + ${r.index} + '] ' + ${r.documentTitle} + ' / ' + ${r.sectionPath} + '（第 ' + ${r.startLine} + '-' + ${r.endLine} + ' 行）'"></summary>
                <pre th:text="${r.fullContent}"></pre>
            </details>
        </div>
    </div>

    <div class="panel" th:if="${result != null and !result.recommended.isEmpty()}">
        <h2 class="section-title">相关笔记</h2>
        <div class="ref-list">
            <details class="ref-item" th:each="r : ${result.recommended}">
                <summary th:text="${r.documentTitle} + ' / ' + ${r.sectionPath}"></summary>
                <pre th:text="${r.fullContent}"></pre>
            </details>
        </div>
    </div>
</main>

</body>
</html>
