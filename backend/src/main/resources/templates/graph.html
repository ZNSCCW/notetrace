<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知识图谱 · NoteTrace 知溯</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">NoteTrace<span class="brand-sub">知溯 · AI 知识库</span></div>
        <nav class="nav">
            <a href="/" th:classappend="${currentPage == 'qa'} ? 'active'">问答</a>
            <a href="/documents" th:classappend="${currentPage == 'documents'} ? 'active'">入库状态</a>
            <a href="/graph" th:classappend="${currentPage == 'graph'} ? 'active'">知识图谱</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="page-title">知识图谱</h1>
    <p class="page-desc">主题来自笔记章节路径；概念由 LLM 按文档抽取。点击主题或概念查看关联。</p>

    <div class="graph-cols">
        <div class="panel">
            <h2 class="section-title">主题树（<span th:text="${#lists.size(topics)}">0</span>）</h2>
            <ul class="topic-tree">
                <li th:each="t : ${topics}" th:class="'depth-' + ${t.name.split('/').length - 1}"
                    th:classappend="${selectedTopic == t.name} ? ' selected'">
                    <a th:href="@{/graph(topic=${t.name})}" th:text="${t.name}">主题</a>
                </li>
            </ul>
            <p class="empty" th:if="${topics.isEmpty()}">暂无主题，先导入笔记。</p>
        </div>

        <div>
            <div class="panel">
                <h2 class="section-title" th:if="${selectedTopic}" th:text="'「' + ${selectedTopic} + '」下的笔记'">主题笔记</h2>
                <p class="empty" th:if="${selectedTopic != null and topicNotes.isEmpty()}">该主题下暂无笔记。</p>
                <ul class="topic-tree" th:if="${selectedTopic != null and !topicNotes.isEmpty()}">
                    <li th:each="n : ${topicNotes}"><span class="muted" th:text="${n.sourcePath}">笔记</span></li>
                </ul>
                <div th:if="${selectedTopic != null and !topicConcepts.isEmpty()}" style="margin-top:16px;">
                    <p class="section-title" th:text="'涉及概念（' + ${#lists.size(topicConcepts)} + '）'">涉及概念</p>
                    <div class="tags">
                        <span class="tag" th:each="c : ${topicConcepts}"><a th:href="@{/graph(concept=${c.name})}" th:text="${c.name}">概念</a></span>
                    </div>
                </div>
                <h2 class="section-title" th:if="${selectedTopic == null}">全部笔记（<span th:text="${#lists.size(notes)}">0</span>）</h2>
                <ul class="topic-tree" th:if="${selectedTopic == null and !notes.isEmpty()}">
                    <li th:each="n : ${notes}"><span class="muted" th:text="${n.sourcePath}">笔记</span></li>
                </ul>
            </div>

            <div class="panel" style="margin-top:16px;">
                <h2 class="section-title">概念（<span th:text="${#lists.size(concepts)}">0</span> · LLM 抽取）</h2>
                <div class="tags" th:if="${!concepts.isEmpty()}">
                    <span class="tag" th:each="c : ${concepts}"><a th:href="@{/graph(concept=${c.name})}" th:text="${c.name}">概念</a></span>
                </div>
                <p class="empty" th:if="${concepts.isEmpty()}">暂无概念（需 DeepSeek API 可用时抽取）。</p>
                <p class="section-title" th:if="${selectedConcept}" style="margin-top:16px;" th:text="'「' + ${selectedConcept} + '」出现在：'">概念笔记</p>
                <ul class="topic-tree" th:if="${selectedConcept}">
                    <li th:each="n : ${conceptNotes}"><span class="muted" th:text="${n.sourcePath}">笔记</span></li>
                </ul>
            </div>

            <div class="panel" style="margin-top:16px;">
                <h2 class="section-title">关系问答：两概念共同出现的笔记</h2>
                <form method="get" action="/graph" style="display:flex; gap:8px;">
                    <input type="text" class="input" name="relX" th:value="${relX}" placeholder="概念 X，如：线程池">
                    <input type="text" class="input" name="relY" th:value="${relY}" placeholder="概念 Y，如：并发">
                    <button type="submit" class="btn">查关系</button>
                </form>
                <ul class="topic-tree" th:if="${relationNotes != null and !relationNotes.isEmpty()}" style="margin-top:12px;">
                    <li th:each="n : ${relationNotes}"><span class="muted" th:text="${n.sourcePath}">笔记</span></li>
                </ul>
                <p class="empty" th:if="${relationNotes != null and relationNotes.isEmpty()}"
                   th:text="'没有同时出现「' + ${relX} + '」和「' + ${relY} + '」的笔记'">无结果</p>
            </div>
        </div>
    </div>
</main>

</body>
</html>
