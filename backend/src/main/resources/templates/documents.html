<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>入库状态 · NoteTrace 知溯</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">NoteTrace<span class="brand-sub">知溯 · AI 知识库</span></div>
        <nav class="nav">
            <a href="/" th:classappend="${currentPage == 'qa'} ? 'active'">问答</a>
            <a href="/documents" th:classappend="${currentPage == 'documents'} ? 'active'">入库状态</a>
            <a href="/graph" th:classappend="${currentPage == 'graph'} ? 'active'">知识图谱</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1 class="page-title">入库状态</h1>
    <p class="page-desc">上传或删除笔记，索引与知识图谱会自动同步。</p>

    <div class="panel">
        <form method="post" action="/documents/upload" enctype="multipart/form-data" style="display:flex; gap:10px; align-items:center;">
            <input type="file" name="file" accept=".md,.txt" multiple class="input" style="flex:1;">
            <button type="submit" class="btn">上传并入库</button>
        </form>
        <p class="hint" style="margin-top:6px;">支持多选文件批量上传。</p>
        <p class="msg-error" th:if="${param.msg == 'empty'}">请先选择文件。</p>
        <p class="msg-error" th:if="${param.msg == 'error'}">上传失败，请查看后端日志。</p>
    </div>

    <div class="panel" th:if="${!documents.isEmpty()}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span class="muted" th:text="${#lists.size(documents)} + ' 篇文档'">文档数</span>
            <button class="btn-danger" onclick="batchDelete()">删除选中</button>
        </div>
        <table class="table">
            <thead>
                <tr>
                    <th style="width:32px;"><input type="checkbox" id="check-all" title="全选" onclick="toggleAll(this)"></th>
                    <th>文档</th><th>状态</th><th>chunks</th><th>更新时间</th><th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="d : ${documents}">
                    <td><input type="checkbox" class="chk" name="chk" th:value="${d.doc.sourcePath}"></td>
                    <td th:text="${d.doc.sourcePath}"></td>
                    <td>
                        <span th:if="${d.doc.status == 'PROCESSED'}" class="badge badge-ok">已处理</span>
                        <span th:if="${d.doc.status == 'FAILED'}" class="badge badge-fail">失败</span>
                        <span th:if="${d.doc.status != 'PROCESSED' and d.doc.status != 'FAILED'}" class="badge badge-muted" th:text="${d.doc.status}">未知</span>
                    </td>
                    <td th:text="${d.chunkCount}"></td>
                    <td class="muted" th:text="${#temporals.format(d.doc.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <form method="post" action="/documents/delete" onsubmit="return confirm('确认删除该笔记？将同时移除其索引与图谱关联。')">
                            <input type="hidden" name="sourcePath" th:value="${d.doc.sourcePath}">
                            <button class="btn-danger" type="submit">删除</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <p class="empty" th:if="${documents.isEmpty()}">暂无入库文档。上传 .md / .txt 文件，或放入 data/notes 目录后重启应用。</p>

    <form id="batch-del" method="post" action="/documents/delete-batch" style="display:none;"></form>
    <script>
        function toggleAll(master) {
            document.querySelectorAll('.chk').forEach(function (c) { c.checked = master.checked; });
        }
        function batchDelete() {
            var sel = Array.from(document.querySelectorAll('.chk:checked'));
            if (!sel.length) { alert('请先勾选要删除的笔记。'); return; }
            if (!confirm('确认删除选中的 ' + sel.length + ' 个笔记？将同时移除其索引与图谱关联。')) { return; }
            var f = document.getElementById('batch-del');
            f.innerHTML = '';
            sel.forEach(function (c) {
                var i = document.createElement('input');
                i.type = 'hidden'; i.name = 'sourcePaths'; i.value = c.value;
                f.appendChild(i);
            });
            f.submit();
        }
    </script>

    <p class="hint">提示：直接丢文件到 data/notes 目录同样会被识别（重启生效）；删除会同时移除磁盘文件、检索索引与图谱关联。</p>
</main>

</body>
</html>
